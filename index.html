.main{

}

  .box{
    width:48%;
    height:22%;
    border-radius:18px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
}
  .box img{
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .box h3{
    display:none;
  }
  .box .back{
    display:none;
    font-size:18px;
  }
  .active{
    position:fixed;
    padding:0px;
    left:0px;
    top:0px;
    width:100%;
    height:100%;
    border-radius:0px;
    z-index:10;
  }
  .active .back{
    position:absolute;
    top:5px;
    user-select:none;
    margin:10px;
    padding:10px 20px;
    left:0px;
    background:white;
    z-index:10;
    border:none;
    border-radius:10px;
    display:block;
  }
 .active h3{
   position:fixed;
   top:20px;
   user-select:none;
   left:50%;
   display:flex;
   justify-content:center;
   align-items:center;
   display:block;
  transform: translateX(-50%);
 }
  
 .active img{

}
